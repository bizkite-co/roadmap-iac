---
- name: Manage the Roadmap Tomcat idle session timeout
  hosts: all
  become: true
  gather_facts: false

  vars:
    roadmap_expected_hosts:
      uat: ubuntu@54.177.161.104
      prod: ubuntu@184.72.30.45
    roadmap_session_timeout_mode: prepare

  pre_tasks:
    - name: Require a single explicitly selected Roadmap host
      ansible.builtin.assert:
        that:
          - roadmap_environment in ['uat', 'prod']
          - roadmap_session_timeout_mode in ['prepare', 'verify']
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == roadmap_expected_hosts[roadmap_environment]
        fail_msg: >-
          Select exactly the expected UAT or PROD host and provide
          roadmap_environment=uat|prod before managing Tomcat.

  tasks:
    - name: Converge and validate the 30-minute Tomcat idle timeout
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/roadmap-session-timeout.py {{ roadmap_session_timeout_mode }}"
        executable: /usr/bin/python3
      register: session_timeout_result
      changed_when: "'changed 0 file(s)' not in session_timeout_result.stdout"
